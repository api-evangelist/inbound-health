aid: inbound-health
name: Inbound Health
description: >-
  Inbound Health was a Minneapolis, Minnesota company that enabled health systems and health
  plans to deliver hospital-level and skilled-nursing-level care in patients' homes. It was spun
  out of Allina Health's own Hospital-at-Home and SNF-at-Home programs in October 2022 with $20
  million from Flare Capital Partners, and was led by co-founder and chief executive Dave Kerwar,
  previously chief product officer at Mount Sinai Health System, with Dr. Chi Huang as chief
  medical officer and Dave Zimmerman as chief operating officer. The company raised a $30 million
  Series B in September 2023 led by HealthQuest Capital, and in February 2024 released Inbound
  InHome, a proprietary patient-management and analytics platform for advanced care in the home:
  AI/ML-assisted identification and eligibility screening of candidate patients, device-agnostic
  biometric monitoring across devices, wearables and in-home sensors, a virtual care module
  carrying real-time video, audio, text and alerting between patient and care team, a workflow
  application automating logistics across the care episode, supply-chain management, and
  integration points into multiple EMRs. Inbound Health ceased operations in December 2025 after
  regulatory uncertainty over the federal Acute Hospital Care at Home (AHCAH) waiver stalled its
  next financing round; MedArrive acquired its AI-backed care-navigation technology assets in
  March 2026. Inbound InHome was sold only under signed health-system and health-plan agreements,
  and no public developer portal, API reference, SDK, or machine-readable specification (OpenAPI,
  AsyncAPI, GraphQL SDL, MCP manifest or A2A agent card) was ever published on an Inbound Health
  host. Both inboundhealth.com and www.inboundhealth.com now fail at the origin behind Cloudflare
  (HTTP 526) and every api/docs/developer/app/portal/status subdomain has been removed from DNS,
  so there is no live API surface to catalog. This profile is retained as a historical record.
