x-domain-note: >-
  inboundhealth.com is still registered to the company (GoDaddy, created 2018-01-06, registry
  expiry 2027-01-06, record updated 2026-01-07) and is still fronted by Cloudflare with a valid
  Google Trust Services certificate, but the origin behind it is gone. Every HTTPS path — the
  root, /openapi.json, every /.well-known/ path, and a nonsense control path — returns the same
  16-byte Cloudflare HTTP 526 body; over plain HTTP the same host returns a byte-identical
  1,957-byte "Site is not available" page with HTTP 404 on every path. MX still points at
  Microsoft 365, which is why the zone is still maintained. Because the site is confirmed dead it
  is deliberately NOT wired as a Website pointer. The previous Website pointer on this profile
  (https://www.nasdaqprivatemarket.com/) was the secondary-market venue this company was harvested
  from, not the company's own web presence, and has been removed — see
  https://github.com/api-evangelist/roadmap/issues/56.
